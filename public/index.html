        <section id="featured-beers" class="container">
            <header class="heading-section">
                <h2>-Cervezas destacadas-</h2>
            </header>

            <div class="featured-beers__cards">
                <div class="beer-card">
                    <span class="beer-card__tag" aria-label="Novedad">
                        Novedad
                    </span>

                    <img src="cervezasDestacadas/destacada1.png" class="beer-card__img" alt="Imagen de Lúpulo Salvaje">

                    <h3 class="beer-card__name">
                        Lúpulo Salvaje
                    </h3>

                    <div class="beer-card__info">
                        <span class="beer-card__type">IPA (Indian Pale Ale)</span>
                        <span class="beer-card__alc">6.5%</span>
                        <span class="beer-card__ibu">60 IBU</span>
                    </div>

                    <div class="beer-card__actions">
                        <button type="button" class="beer-card__details" data-beer="novedad" data-beer-id="1">
                            <!-- <i class="fa-regular fa-eye"></i> -->
                            Ver más
                        </button>
                    </div>
                </div>

                <div class="beer-card">
                    <span class="beer-card__tag" aria-label="La más pedida">
                        La más pedida
                    </span>

                    <img src="cervezasDestacadas/destacada2.png" class="beer-card__img" alt="Imagen de Dorado Miel">

                    <h3 class="beer-card__name">
                        Dorado Miel
                    </h3>

                    <div class="beer-card__info">
                        <span class="beer-card__type">Belgian Tripel</span>
                        <span class="beer-card__alc">8.5%</span>
                        <span class="beer-card__ibu">30 IBU</span>
                    </div>

                    <div class="beer-card__actions">
                        <button type="button" class="beer-card__details" data-beer="novedad" data-beer-id="2">
                            <!-- <i class="fa-regular fa-eye"></i> -->
                            Ver más
                        </button>
                    </div>
                </div>

                <div class="beer-card">
                    <span class="beer-card__tag" aria-label="Clásica">
                        Clásica
                    </span>

                    <img src="cervezasDestacadas/destacada3.png" class="beer-card__img" alt="Imagen de Trigo Suave">

                    <h3 class="beer-card__name">
                        Trigo Suave
                    </h3>

                    <div class="beer-card__info">
                        <span class="beer-card__type">Hefeweizen</span>
                        <span class="beer-card__alc">5.2%</span>
                        <span class="beer-card__ibu">15 IBU</span>
                    </div>

                    <div class="beer-card__actions">
                        <button type="button" class="beer-card__details" data-beer="novedad" data-beer-id="3">
                            <!-- <i class="fa-regular fa-eye"></i> -->
                            Ver más
                        </button>
                    </div>
                </div>
            </div>

            <div id="beer-info-modal" class="modal show">
                <div class="modal-content">
                    <span class="close-btn">&times;</span>

                    <img src="" alt="" id="beer-img">

                    <h2 id="beer-title"></h2>

                    <p id="beer-details"></p>
                </div>
            </div>
        </section>
